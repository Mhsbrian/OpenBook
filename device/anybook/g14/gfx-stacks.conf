# openbook-gfx-stacks/1
# The graphics modes this image may switch (ANAL-246, docs/nvidia-graphics-modes.md §4), read by openbook-gfx-mode.
#   board NAME                   a DMI board_name whose MUX OpenBook may switch: Eco and Hybrid
#   stack NAME STATE [REF]       unverified, development (a dev image: Ultimate through the lab only) or verified
#   file NAME PATH               a file the stack needs; a missing one makes the stack unverified
#   offer ultimate               the app may offer Ultimate. The release builder writes it only with a verified
#                                stack, and only once both slots and the stick carry this switcher (§5.4)
# Ultimate is not available in this version: nouveau does not drive the panel yet (ANAL-244).
board GA403WR
stack nouveau unverified ANAL-244
