# SPDX-License-Identifier: Apache-2.0
# A stricter drop-in for the `seed` service in openbook.page's Portainer stack (docs/RELEASE.md section 4): replace
# that service with this one. No web UI, no password, no root init, no added capabilities, no .watch folder: it seeds
# what the site's releases.json lists and does not hide. If Portainer can't build from a git URL, copy this folder
# into the site repository and use `build: ./seeder`.
name: openbook-page
services:
  seed:
    build:
      context: https://github.com/Mhsbrian/OpenBook.git#main:tools/release/seeder
    image: openbook-seeder:local
    restart: unless-stopped
    ports:
      # The only port this service opens. Forward 51413 TCP and UDP on the router to the NAS:
      # cloudflared carries HTTP(S) only, so peers can't reach the seeder through the tunnel.
      - "51413:51413/tcp"
      - "51413:51413/udp"
    environment:
      PEER_PORT: "51413"
      SEED_UP_KBPS: "0"      # upload cap in KB/s (e.g. 5000 is 40 Mbit/s); 0 = no cap
      PEER_LIMIT: "200"
      SYNC_SECONDS: "60"     # how often it looks for new releases and refreshes swarm.json
    volumes:
      - ${RELEASES_DIR:-/volume1/docker/openbook/releases}:/releases:ro
      - seeder-state:/state
      - seeder-status:/status
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  seeder-state:
  seeder-status:
