<!DOCTYPE html>
<!--
  OpenBook installer: high-fidelity design (ANAL-189).
  The recommended wizard is an Android app in the live OpenBook session (docs/installer.md §4), so these screens use
  Material 3 Expressive in a desktop window: Roboto Flex, Material Symbols Rounded, tonal surfaces, a pill-shaped
  action row, and a wavy progress indicator.
  Every hardware value, size and timing on these screens is sample data for illustration.

  View: open in a browser (gallery). One screen at 1440x900: index.html?screen=<id>[&theme=dark].
  Render all PNGs: scripts/installer/render-design.sh
  Fonts: fonts/ (not committed; render-design.sh fetches them) or Google Fonts when online.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenBook installer: design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0">
<style>
@font-face { font-family: "OB Flex"; src: url("fonts/RobotoFlex.ttf") format("truetype"); font-weight: 100 1000; font-display: block; }
@font-face { font-family: "OB Symbols"; src: url("fonts/MaterialSymbolsRounded.ttf") format("truetype"); font-weight: 100 700; font-display: block; }

/* ---------- Color roles (Material 3, seed #4A5BD4) ---------- */
:root, [data-theme="light"] {
  --primary: #4355B9; --on-primary: #fff; --primary-container: #DEE0FF; --on-primary-container: #00105C;
  --secondary: #5B5D72; --secondary-container: #E0E1F9; --on-secondary-container: #181A2C;
  --tertiary: #8A4A62; --tertiary-container: #FFD9E3; --on-tertiary-container: #390A1E;
  --error: #BA1A1A; --on-error: #fff; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #276A3B; --success-container: #B6F1BE; --on-success-container: #00210B;
  --warning: #775A00; --warning-container: #FFDF9A; --on-warning-container: #251A00;
  --surface: #FBF8FF; --surface-lowest: #FFFFFF; --surface-low: #F5F2FB; --surface-mid: #EFEDF6;
  --surface-high: #E9E7F0; --surface-highest: #E3E1EA;
  --on-surface: #1B1B21; --on-surface-variant: #46464F; --outline: #767680; --outline-variant: #C6C5D0;
  --scrim: rgba(17, 20, 45, .14);
  --wall: radial-gradient(900px 640px at 12% 18%, #C3CBFF 0%, transparent 62%),
          radial-gradient(760px 600px at 88% 10%, #FFD3E6 0%, transparent 58%),
          radial-gradient(900px 700px at 78% 96%, #BFEDE6 0%, transparent 60%),
          radial-gradient(700px 560px at 30% 100%, #FFE4C7 0%, transparent 60%),
          linear-gradient(140deg, #EEF0FF 0%, #F8F1FB 55%, #F1F7F6 100%);
  --taskbar: rgba(251, 248, 255, .72);
  --win-shadow: 0 30px 80px rgba(37, 42, 98, .26), 0 6px 18px rgba(37, 42, 98, .10);
  --bar-win: #4C74E6; --bar-linux: #E8A23C; --bar-efi: #8D8FA3; --bar-ob: linear-gradient(90deg, #4355B9, #8A5CF0);
}
[data-theme="dark"] {
  --primary: #BAC3FF; --on-primary: #08218A; --primary-container: #293CA0; --on-primary-container: #DEE0FF;
  --secondary: #C4C5DD; --secondary-container: #43465A; --on-secondary-container: #E0E1F9;
  --tertiary: #FFB0C9; --tertiary-container: #6E3349; --on-tertiary-container: #FFD9E3;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #9BD5A3; --success-container: #0B5225; --on-success-container: #B6F1BE;
  --warning: #EFC048; --warning-container: #5A4300; --on-warning-container: #FFDF9A;
  --surface: #121318; --surface-lowest: #0D0E13; --surface-low: #1B1B21; --surface-mid: #1F1F25;
  --surface-high: #2A292F; --surface-highest: #35343A;
  --on-surface: #E4E1E9; --on-surface-variant: #C6C5D0; --outline: #90909A; --outline-variant: #46464F;
  --scrim: rgba(0, 0, 0, .35);
  --wall: radial-gradient(900px 640px at 14% 20%, rgba(83, 101, 230, .55) 0%, transparent 62%),
          radial-gradient(760px 600px at 86% 8%, rgba(176, 82, 160, .45) 0%, transparent 58%),
          radial-gradient(900px 700px at 76% 98%, rgba(26, 140, 128, .40) 0%, transparent 60%),
          linear-gradient(150deg, #0B0D1C 0%, #12101F 55%, #0B1716 100%);
  --taskbar: rgba(27, 27, 33, .70);
  --win-shadow: 0 30px 90px rgba(0, 0, 0, .60), 0 6px 18px rgba(0, 0, 0, .35);
  --bar-win: #7F9CFF; --bar-linux: #F2B95E; --bar-efi: #9FA1B5; --bar-ob: linear-gradient(90deg, #8E9CFF, #C49BFF);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "OB Flex", "Roboto Flex", "Noto Sans", system-ui, sans-serif; color: #1B1B21; background: #E9EAF2;
       -webkit-font-smoothing: antialiased; font-optical-sizing: auto; }
.ms { font-family: "OB Symbols", "Material Symbols Rounded"; font-weight: 400; font-style: normal; font-size: 22px; line-height: 1;
      letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
      font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; user-select: none; }
.ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }

/* ---------- Gallery ---------- */
.gallery-head { max-width: 1520px; margin: 40px auto 8px; padding: 0 40px; }
.gallery-head h1 { font-size: 34px; font-weight: 560; margin: 0 0 6px; letter-spacing: -0.01em; }
.gallery-head p { margin: 0; color: #55566A; font-size: 15px; }
.gallery { display: grid; grid-template-columns: repeat(2, 720px); gap: 36px 40px; justify-content: center; padding: 28px 40px 60px; }
.gallery figure { margin: 0; }
.gallery figcaption { font-size: 14px; color: #44465A; margin-top: 12px; }
.gallery figcaption b { color: #1B1B21; font-weight: 600; }
.gallery .artboard { zoom: .5; border-radius: 24px; box-shadow: 0 10px 40px rgba(30, 30, 70, .18); }
body.single { background: #000; }
body.single .gallery-head { display: none; }
body.single .gallery { display: block; padding: 0; }
body.single figure > figcaption { display: none; }
body.single .artboard { zoom: 1; border-radius: 0; box-shadow: none; }

/* ---------- Desktop ---------- */
.artboard { width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--wall); color: var(--on-surface); }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: var(--taskbar); backdrop-filter: blur(24px);
           border-top: 1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent); display: flex; align-items: center; padding: 0 18px; }
.taskbar .apps { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
.tb-app { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; color: #fff; position: relative; }
.tb-app .ms { font-size: 22px; }
.tb-app.active::after { content: ""; position: absolute; bottom: -7px; width: 16px; height: 3px; border-radius: 3px; background: var(--primary); }
.tb-left { display: flex; align-items: center; gap: 6px; color: var(--on-surface); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--on-surface); font-size: 14px; font-weight: 500; }
.tb-right .ms { font-size: 20px; }
.live-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12.5px; font-weight: 600;
             background: var(--primary-container); color: var(--on-primary-container); }
.live-chip .ms { font-size: 16px; }

/* ---------- Window ---------- */
.window { position: absolute; left: 150px; top: 40px; width: 1140px; height: 776px; border-radius: 22px; overflow: hidden;
          background: var(--surface); box-shadow: var(--win-shadow); display: flex; flex-direction: column;
          outline: 1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent); }
.caption { height: 46px; flex: none; display: flex; align-items: center; padding: 0 10px 0 18px; gap: 10px; background: var(--surface-mid);
           font-size: 13.5px; font-weight: 600; color: var(--on-surface); }
.caption .ctl { margin-left: auto; display: flex; gap: 4px; }
.caption .ctl span { width: 34px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--on-surface-variant); }
.caption .ctl .ms { font-size: 19px; }
.win-body { flex: 1; display: grid; grid-template-columns: 286px 1fr; min-height: 0; }

/* rail */
.rail { background: var(--surface-low); padding: 26px 22px 22px; display: flex; flex-direction: column; border-right: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent); }
.brand { display: flex; align-items: center; gap: 12px; margin: 0 0 30px 4px; }
.brand .word { font-size: 23px; font-weight: 640; letter-spacing: -0.02em; }
.brand .sub { font-size: 12.5px; color: var(--on-surface-variant); font-weight: 500; margin-top: 1px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 34px 1fr; column-gap: 14px; align-items: center; position: relative; padding: 9px 4px; border-radius: 16px; }
.steps li + li::before { content: ""; position: absolute; left: 20px; top: -9px; height: 18px; width: 2px; background: var(--outline-variant); }
.steps li.done + li::before { background: var(--primary); }
.dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 650;
       border: 2px solid var(--outline-variant); color: var(--on-surface-variant); background: var(--surface-low); position: relative; z-index: 1; }
.steps li.done .dot { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.steps li.done .dot .ms { font-size: 19px; font-variation-settings: "FILL" 1, "wght" 600, "GRAD" 0, "opsz" 20; }
.steps li.now { background: color-mix(in srgb, var(--primary-container) 70%, transparent); }
.steps li.now .dot { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: 0 0 0 5px color-mix(in srgb, var(--primary) 18%, transparent); }
.steps .lbl { font-size: 15px; font-weight: 560; }
.steps li:not(.done):not(.now) .lbl { color: var(--on-surface-variant); font-weight: 500; }
.steps .hint { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 1px; font-weight: 450; }
.assure { margin-top: auto; border-radius: 18px; padding: 14px 16px; background: var(--surface-high); display: flex; gap: 12px; font-size: 13px; line-height: 1.4; color: var(--on-surface-variant); }
.assure .ms { color: var(--primary); font-size: 22px; }

/* content */
.content { padding: 40px 56px 28px; display: flex; flex-direction: column; min-width: 0; }
.eyebrow { font-size: 13.5px; font-weight: 650; letter-spacing: .02em; color: var(--primary); margin-bottom: 10px; }
h2.headline { font-size: 40px; line-height: 48px; font-weight: 520; letter-spacing: -0.02em; margin: 0 0 10px; }
.lede { font-size: 16.5px; line-height: 25px; color: var(--on-surface-variant); margin: 0 0 26px; max-width: 660px; }
.grow { flex: 1; min-height: 0; }
.actions { display: flex; align-items: center; gap: 12px; padding-top: 18px; }
.actions .push { margin-left: auto; }
.btn { height: 46px; padding: 0 26px; border-radius: 23px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 620; letter-spacing: .01em; border: 0; }
.btn .ms { font-size: 20px; }
.btn.filled { background: var(--primary); color: var(--on-primary); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
.btn.outlined { border: 1.5px solid var(--outline-variant); color: var(--primary); background: transparent; }
.btn.text { color: var(--primary); padding: 0 14px; }
.btn.danger { background: var(--error); color: var(--on-error); }
.btn.big { height: 54px; border-radius: 27px; padding: 0 30px; font-size: 16px; }

.card { background: var(--surface-low); border-radius: 22px; padding: 18px 20px; }
.card.high { background: var(--surface-mid); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12.5px; font-weight: 640; white-space: nowrap; }
.pill .ms { font-size: 16px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
.pill.ok { background: var(--success-container); color: var(--on-success-container); }
.pill.warn { background: var(--warning-container); color: var(--on-warning-container); }
.pill.off { background: var(--surface-highest); color: var(--on-surface-variant); }
.pill.info { background: var(--primary-container); color: var(--on-primary-container); }
.mono { font-family: "JetBrainsMono NF", "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }

/* ---------- 1 Welcome ---------- */
.welcome { display: grid; grid-template-columns: 400px 1fr; height: 100%; }
.hero { position: relative; overflow: hidden; color: #fff; padding: 46px 42px; display: flex; flex-direction: column;
        background: radial-gradient(420px 360px at 20% 10%, #7D8BFF 0%, transparent 70%),
                    radial-gradient(420px 420px at 100% 100%, #C06CF0 0%, transparent 65%),
                    radial-gradient(300px 300px at 0% 100%, #FF9B7A 0%, transparent 70%),
                    linear-gradient(160deg, #3446B0 0%, #5B3FC4 60%, #7B3FB3 100%); }
.hero .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .22; background: #fff; }
.hero .big-logo { margin-top: 120px; }
.hero .hw { font-size: 52px; line-height: 56px; font-weight: 640; letter-spacing: -0.035em; margin: 26px 0 12px; }
.hero .tag { font-size: 18px; line-height: 26px; opacity: .92; max-width: 300px; font-weight: 450; }
.hero .foot { margin-top: auto; display: flex; gap: 10px; align-items: center; font-size: 13px; opacity: .9; }
.hero .foot .hchip { background: rgba(255,255,255,.18); border-radius: 14px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.hero .foot .ms { font-size: 17px; }
.lang-grid { display: grid; grid-template-columns: 1fr 262px; gap: 22px; }
.search { height: 48px; border-radius: 24px; background: var(--surface-high); display: flex; align-items: center; gap: 10px; padding: 0 18px; color: var(--on-surface-variant); font-size: 15px; margin-bottom: 8px; }
.lang { list-style: none; margin: 0; padding: 0; }
.lang li { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 16px; border-radius: 16px; }
.lang li .n { font-size: 15.5px; font-weight: 560; white-space: nowrap; }
.lang li .e { font-size: 13px; color: var(--on-surface-variant); margin-left: auto; }
.lang li.sel { background: var(--primary-container); color: var(--on-primary-container); }
.lang li.sel .e { color: var(--on-primary-container); opacity: .8; }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--outline); flex: none; }
.sel .radio, .radio.on { border-color: var(--primary); box-shadow: inset 0 0 0 4px var(--surface-lowest), inset 0 0 0 10px var(--primary); }
.field { border-radius: 14px; border: 1.5px solid var(--outline-variant); padding: 8px 14px 10px; }
.field .k { font-size: 12px; color: var(--on-surface-variant); font-weight: 600; }
.field .v { font-size: 15.5px; font-weight: 520; display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 11px; border-radius: 12px; border: 1.5px solid var(--outline-variant);
        font-size: 13.5px; font-weight: 580; color: var(--on-surface-variant); }
.chip .ms { font-size: 19px; }
.chip.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
.side-label { font-size: 13px; font-weight: 650; color: var(--on-surface-variant); margin: 6px 0 10px; letter-spacing: .02em; }

/* ---------- 2 Hardware ---------- */
.device { display: flex; align-items: center; gap: 22px; padding: 18px 22px; border-radius: 24px;
          background: linear-gradient(120deg, var(--success-container), color-mix(in srgb, var(--success-container) 30%, var(--surface-low))); margin-bottom: 18px; }
.device .t { font-size: 20px; font-weight: 620; letter-spacing: -0.01em; color: var(--on-success-container); }
.device .s { font-size: 14px; color: color-mix(in srgb, var(--on-success-container) 75%, transparent); margin-top: 3px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { background: var(--surface-low); border-radius: 20px; padding: 14px 14px 14px 14px; display: grid; grid-template-columns: 42px 1fr; column-gap: 12px; align-items: center; }
.tile .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-high); color: var(--primary); grid-row: span 2; }
.tile .ic .ms { font-size: 22px; }
.tile .nm { font-size: 14.5px; font-weight: 620; white-space: nowrap; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tile .dt { font-size: 12.5px; color: var(--on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 3 Try / install ---------- */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.choice { border-radius: 28px; background: var(--surface-low); overflow: hidden; outline: 1.5px solid transparent; position: relative; }
.choice.sel { outline: 2.5px solid var(--primary); background: color-mix(in srgb, var(--primary-container) 35%, var(--surface-low)); }
.choice .art { height: 210px; display: grid; place-items: center; }
.choice .art.a { background: radial-gradient(240px 180px at 30% 30%, #CFE0FF, transparent 70%), radial-gradient(240px 200px at 80% 80%, #D9F3EC, transparent 70%), var(--surface-mid); }
.choice .art.b { background: radial-gradient(240px 180px at 25% 25%, #DCD3FF, transparent 70%), radial-gradient(240px 200px at 85% 85%, #FFDCE8, transparent 70%), var(--surface-mid); }
[data-theme="dark"] .choice .art.a, [data-theme="dark"] .choice .art.b { background: radial-gradient(240px 200px at 30% 30%, rgba(90,110,230,.35), transparent 70%), var(--surface-high); }
.choice .bd { padding: 20px 24px 22px; }
.choice h3 { margin: 0 0 6px; font-size: 22px; font-weight: 620; letter-spacing: -0.01em; }
.choice p { margin: 0 0 12px; font-size: 14.5px; line-height: 21px; color: var(--on-surface-variant); }
.choice ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.choice li { display: flex; gap: 9px; align-items: center; font-size: 14px; }
.choice li .ms { font-size: 19px; color: var(--primary); font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
.choice .tick { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.choice .tick .ms { font-size: 20px; font-variation-settings: "FILL" 1, "wght" 600, "GRAD" 0, "opsz" 20; }
.choice .tick.no { background: transparent; border: 2px solid var(--outline); }

/* ---------- 4 Disk ---------- */
.disk { border-radius: 24px; padding: 18px 20px; background: var(--surface-low); margin-bottom: 12px; }
.disk.sel { outline: 2.5px solid var(--primary); background: color-mix(in srgb, var(--primary-container) 30%, var(--surface-low)); }
.disk.locked { opacity: .78; }
.disk .top { display: flex; align-items: center; gap: 16px; }
.disk .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); flex: none; }
.disk.locked .ic { background: var(--surface-highest); color: var(--on-surface-variant); }
.disk .ic .ms { font-size: 28px; }
.disk .nm { font-size: 18px; font-weight: 620; letter-spacing: -0.01em; }
.disk .dt { font-size: 13.5px; color: var(--on-surface-variant); margin-top: 3px; }
.disk .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.bar { display: flex; height: 30px; border-radius: 12px; overflow: hidden; gap: 3px; margin: 16px 0 10px; }
.bar span { height: 100%; border-radius: 6px; }
.bar .free { background: repeating-linear-gradient(135deg, var(--surface-highest) 0 7px, color-mix(in srgb, var(--surface-highest) 55%, transparent) 7px 14px); }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--on-surface-variant); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: 0; }
.legend b { color: var(--on-surface); font-weight: 600; }
.seg { display: inline-flex; border: 1.5px solid var(--outline); border-radius: 22px; overflow: hidden; height: 44px; }
.seg span { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; font-size: 14.5px; font-weight: 600; color: var(--on-surface); }
.seg span + span { border-left: 1.5px solid var(--outline); }
.seg span.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.seg .ms { font-size: 19px; }
.after { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-size: 14px; color: var(--on-surface-variant); }
.after .mini { flex: 1; height: 12px; border-radius: 6px; background: var(--bar-ob); }

/* ---------- 5 Confirm ---------- */
.warnbox { border-radius: 24px; background: var(--error-container); color: var(--on-error-container); padding: 20px 22px; display: grid; grid-template-columns: 44px 1fr; gap: 14px; }
.warnbox .ic { width: 44px; height: 44px; border-radius: 14px; background: color-mix(in srgb, var(--error) 18%, transparent); display: grid; place-items: center; }
.warnbox .ic .ms { color: var(--error); font-size: 26px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.warnbox h4 { margin: 2px 0 8px; font-size: 17px; font-weight: 650; }
.warnbox ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14.5px; }
.warnbox li { display: flex; align-items: center; gap: 10px; }
.warnbox li i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.warnbox li .sz { margin-left: auto; font-weight: 600; }
.beforeafter { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; gap: 8px; margin: 18px 0; }
