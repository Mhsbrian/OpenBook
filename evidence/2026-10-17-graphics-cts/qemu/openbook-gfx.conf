title OpenBook graphics check (about 30 min, then powers off)
version 17 · live
sort-key openbook-95
linux /openbook/a/kernel
initrd /openbook/a/vendor_ramdisk.img
initrd /openbook/a/ramdisk.img
initrd /openbook/a/live.img
initrd /openbook/gfx/gfx-init.img
initrd /openbook/a/bootconfig-vm-logs.img
options firmware_class.path=/vendor/firmware log_buf_len=1M bootconfig rdinit=/openbook-gfx-init console=ttyS0,115200 8250.nr_uarts=1 printk.devkmsg=on androidboot.openbook.addon=gfx androidboot.openbook.addon_timeout=5400 androidboot.openbook.logs_settle=90 openbook.gfx_quick=1
