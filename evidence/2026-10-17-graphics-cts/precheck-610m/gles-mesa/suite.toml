[[deqp]]
deqp = "/deqp/deqp-binary64"
caselists = ["/cl/gles2.txt"]
tests_per_group = 500
renderer_check = "radeonsi"
deqp_args = ["--deqp-archive-dir=/deqp", "--deqp-log-images=disable", "--deqp-log-shader-sources=disable", "--deqp-shadercache=disable", "--deqp-surface-width=256", "--deqp-surface-height=256", "--deqp-surface-type=pbuffer", "--deqp-visibility=hidden", "--deqp-gl-config-name=rgba8888d24s8ms0"]
[deqp.env]
LD_PRELOAD = "/b/libdeqp_stdout.so"

