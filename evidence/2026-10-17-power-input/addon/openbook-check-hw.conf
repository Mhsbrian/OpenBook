title OpenBook hardware check (no sleep test)
sort-key openbook-93
linux /openbook/check/kernel
initrd /openbook/check/hwcheck.img
initrd /openbook/a/bootconfig-live.img
options printk.devkmsg=on audit=1 panic=-1 8250.nr_uarts=1 binder.impl=rust cma=0 firmware_class.path=/vendor/etc/ loop.max_part=7 bootconfig console=ttyS0,115200 loglevel=7 log_buf_len=8M rdinit=/openbook-check/probe openbook.probe=report
