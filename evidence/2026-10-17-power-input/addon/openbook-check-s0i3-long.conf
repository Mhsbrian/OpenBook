title OpenBook power check: S0i3, 60 s cycles, all steps
sort-key openbook-92
linux /openbook/check/kernel
initrd /openbook/check/hwcheck.img
initrd /openbook/a/bootconfig-live.img
options printk.devkmsg=on audit=1 panic=-1 8250.nr_uarts=1 binder.impl=rust cma=0 firmware_class.path=/vendor/etc/ loop.max_part=7 bootconfig console=ttyS0,115200 loglevel=7 log_buf_len=8M rdinit=/openbook-check/probe openbook.probe=report openbook.probe.sleep=1 openbook.probe.dgpu=detach openbook.probe.acpi_d3cold=_SB.PCI0.GPP0.SWUS openbook.probe.s0i3_snapshot=1 openbook.probe.sleep_s=60 openbook.probe.s0i3_steps=psp,dummy,asus openbook.probe.s0i3_all=1
