# QEMU Wi-Fi test access point (scripts/audio-net-qemu.sh): WPA2-PSK on the second mac80211_hwsim radio, inside
# the guest. The passphrase is test equipment, not a secret: this network exists only inside the VM.
interface=wlan1
driver=nl80211
ssid=openbook-test
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=openbook-test-psk
